<div class="gs-err"></div>
<style>
  .gs-err { font-size: 12px; }
  .gs-err svg { display: block; width: 100%; overflow: visible; }
  .gs-err .rl { fill: var(--text-color); font-size: 12px; }
  .gs-err .rl.me { font-weight: 650; }
  .gs-err .re { fill: var(--muted-color); font-size: 11px; }
  .gs-err .ch { fill: var(--muted-color); font-size: 11px; }
  .gs-err .cv { font-size: 11px; font-variant-numeric: tabular-nums; }
  .gs-err .band { fill: var(--band); }
</style>
<script>
  (() => {
    const K = window.GridsimKit;
    const root = K.mount("gs-err");
    if (!root) return;
    const f = K.fmt;
    const COLS = [
      { k: "ok", l: "every rule kept", good: true },
      { k: "all_idle", l: "all idle" },
      { k: "overfill", l: "overfill" },
      { k: "sell_before_charge", l: "sell before charge" },
      { k: "rate", l: "rate" },
      { k: "cycle_cap", l: "cycle cap" },
      { k: "end_short", l: "end short" },
      { k: "invalid", l: "no valid schedule", of: ["malformed", "truncated", "error"] },
    ];
    K.whenD3(() => K.data("results.json").then((R) => {
      const d3 = window.d3;
      const ORDER = ["blind-fresh", "blind-eval2025", "foresight-eval2025", "foresight-fresh"];
      const packs = ORDER.map((k) => R.leaderboard.packs.find((p) => p.key === k)).filter(Boolean);
      let pi = 0;
      root.innerHTML = '<div class="gs-chips"><span class="gs-lab">Days</span></div><div class="plot"></div><div class="gs-note"></div>';
      const chips = root.querySelector(".gs-chips"), plot = root.querySelector(".plot"), note = root.querySelector(".gs-note");
      const tip = K.tip(root);
      const svg = d3.select(plot).append("svg").attr("class", "gs-svg");
      packs.forEach((p, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "gs-chip";
        const s = document.createElement("b"); s.textContent = p.label; b.appendChild(s);
        b.addEventListener("click", () => { pi = i; render(); });
        chips.appendChild(b);
      });
      function render() {
        chips.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === pi)));
        const P = packs[pi];
        const rows = P.rows.slice().sort((a, b) => b.mean - a.mean);
        const W = plot.clientWidth || 640;
        const narrow = W < 560;
        const lw = narrow ? 112 : 176, top = narrow ? 92 : 80, rh = 28;
        const cw = (W - lw - 6) / COLS.length;
        const H = top + rows.length * rh + 6;
        svg.selectAll("*").remove();
        svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
        COLS.forEach((c, j) => {
          const cx = lw + j * cw + cw / 2;
          svg.append("text").attr("class", "ch").attr("transform", `translate(${cx + 3},${top - 8}) rotate(-38)`).text(c.l);
        });
        const share = (r, c) => { const n = Object.values(r.kinds).reduce((a, b) => a + b, 0); const v = c.of ? c.of.reduce((a, k) => a + (r.kinds[k] || 0), 0) : r.kinds[c.k] || 0; return { v, s: v / n, n }; };
        const heat = d3.scaleLinear().domain([0, 0.5]).range([0.06, 0.85]).clamp(true);
        rows.forEach((r, i) => {
          const y = top + i * rh;
          if (r.key === "final") svg.append("rect").attr("class", "band").attr("x", 0).attr("y", y).attr("width", W).attr("height", rh - 2).attr("rx", 4);
          const short = narrow ? r.label.replace("Qwen3-4B, ", "4B, ").replace("GPT-6.1 ", "").replace("GPT-6 ", "").replace("-1.0", "") : r.label;
          const t = svg.append("text").attr("class", "rl" + (r.key === "final" ? " me" : "")).attr("x", lw - 10).attr("y", y + 17).attr("text-anchor", "end").text(short);
          if (r.effort) t.append("tspan").attr("class", "re").text(` ${r.effort}`);
          COLS.forEach((c, j) => {
            const { v, s, n } = share(r, c);
            const x = lw + j * cw;
            svg.append("rect").attr("x", x + 1).attr("y", y + 2).attr("width", cw - 2).attr("height", rh - 6).attr("rx", 3)
              .style("fill", c.good ? "var(--c-good)" : "var(--c-bad)").style("fill-opacity", v ? (c.good ? 0.12 + 0.25 * s : heat(s)) : 0.03);
            const txt = v === 0 ? "·" : s < 0.0095 ? "<1%" : `${Math.round(100 * s)}%`;
            svg.append("text").attr("class", "cv").attr("x", x + cw / 2).attr("y", y + 17).attr("text-anchor", "middle")
              .style("fill", !c.good && v && heat(s) > 0.55 ? "#fff" : v ? "var(--text-color)" : "var(--muted-color)").style("font-weight", c.good ? 400 : 600).text(txt);
            svg.append("rect").attr("x", x).attr("y", y).attr("width", cw).attr("height", rh).style("fill", "transparent")
              .on("pointerenter pointermove", (ev) => tip.show((el) => {
                K.t.title(el, K.labelOf(r), K.colorOf(r));
                K.t.row(el, c.l, `${v} of ${n} battery-days`);
                K.t.row(el, "share", f.pct(s, 1));
                if (c.of) K.t.note(el, "A reply with no parseable call, or one cut off while still thinking: it scores 0.");
              }, ev)).on("pointerleave", () => tip.hide());
          });
        });
        note.textContent = `${P.label}, ${P.n_tasks} battery-days. Each schedule gets one kind: all idle (24 zeros), else its first broken rule, else a shortfall at the end of the day; the rest keep every rule. A broken rule truncates the day at that hour.`;
      }
      render();
      K.watch(root, render);
    }).catch((e) => { root.textContent = e.message; }));
  })();
</script>
