<div class="gs-space"></div>
<style>
  .gs-space { font-size: 13px; }
  .gs-space .frame { position: relative; width: 100%; height: 720px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); background: #1d2228; }
  .gs-space .wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #c9d1d6; font-size: 13px; text-align: center; padding: 20px; }
  .gs-space iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .gs-space .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; margin-top: 8px; font-size: 12.5px; color: var(--muted-color); }
  .gs-space .foot a { color: var(--muted-color) !important; white-space: nowrap; }
  .gs-space.board .frame { background: var(--page-bg); }
  .gs-space.board .wait { color: var(--muted-color); }
  @media (max-width: 760px) { .gs-space .frame { height: 600px; } }
</style>
<script>
  (() => {
    const K = window.GridsimKit;
    const root = K.mount("gs-space");
    if (!root) return;
    const cfg = K.config(root);
    const APP = "https://earakely-scale-gridsimenv-agentenv.static.hf.space/";
    const views = cfg.views || [{ label: "", path: cfg.path || "index.html" }];
    let vi = 0, live = false;
    if (cfg.kind === "board") root.classList.add("board");
    root.innerHTML = `${views.length > 1 ? '<div class="gs-chips"><span class="gs-lab">Open</span></div>' : ""}
      <div class="frame" style="${cfg.height ? `height:${cfg.height}px` : ""}"><div class="wait">Loading ${cfg.kind === "board" ? "the live board" : "the 3D viewer"} from its Space…</div></div>
      <div class="foot"><span class="why"></span><a class="open" target="_blank" rel="noopener noreferrer">${cfg.openLabel || "Open the Space ↗"}</a></div>`;
    const frame = root.querySelector(".frame"), open = root.querySelector(".open"), why = root.querySelector(".why");
    const chips = root.querySelector(".gs-chips");
    const url = () => APP + views[vi].path;
    function load() {
      if (live) return;
      live = true;
      const f = document.createElement("iframe");
      f.src = url(); f.title = cfg.title || "GridSimEnv viewer"; f.allow = "fullscreen"; f.referrerPolicy = "no-referrer";
      frame.appendChild(f);
    }
    function update() {
      if (chips) chips.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === vi)));
      why.textContent = views[vi].note || cfg.note || "";
      open.href = cfg.openHref || url();
      const f = frame.querySelector("iframe");
      if (f) f.src = url();
    }
    if (chips) views.forEach((v, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "gs-chip"; b.textContent = v.label;
      b.addEventListener("click", () => { vi = i; update(); load(); });
      chips.appendChild(b);
    });
    update();
    if ("IntersectionObserver" in window) new IntersectionObserver((es, io) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); load(); } }, { rootMargin: "900px 0px" }).observe(frame);
    else load();
  })();
</script>
