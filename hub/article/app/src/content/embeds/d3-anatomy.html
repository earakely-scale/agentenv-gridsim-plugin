<div class="gs-anat"></div>
<style>
  .gs-anat { font-size: 13px; color: var(--text-color); }
  .gs-anat .story { font-size: 13.5px; line-height: 1.5; color: var(--text-color); margin: 2px 0 10px; min-height: 20px; }
  .gs-anat .story b { font-weight: 600; }
  .gs-anat .body { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; align-items: start; }
  .gs-anat .read { font-size: 12.5px; line-height: 1.45; color: var(--muted-color); }
  .gs-anat .read .head { font-size: 13px; font-weight: 650; color: var(--text-color); display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .gs-anat .read .head i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .gs-anat .read .kv { display: grid; grid-template-columns: auto auto; gap: 2px 12px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .gs-anat .read .kv span:nth-child(odd) { color: var(--muted-color); }
  .gs-anat .read .kv span:nth-child(even) { color: var(--text-color); text-align: right; }
  .gs-anat .read .score { font-size: 24px; font-weight: 700; color: var(--text-color); letter-spacing: -0.01em; }
  .gs-anat .read .kind { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-bg); border: 1px solid var(--border-color); color: var(--text-color); }
  .gs-anat .read .kind.bad { border-color: var(--c-bad); color: var(--c-bad); }
  .gs-anat .read pre { white-space: pre-wrap; font-size: 11px; line-height: 1.45; margin: 8px 0 0; padding: 8px 9px; border-radius: 6px; background: var(--code-bg); border: 1px solid var(--border-color); color: var(--text-color); max-height: 210px; overflow: auto; }
  .gs-anat .read .q { font-size: 11.5px; margin-top: 8px; }
  .gs-anat svg { display: block; width: 100%; overflow: visible; }
  .gs-anat .pbar { fill: var(--muted-color); fill-opacity: 0.32; }
  .gs-anat .pbar.neg { fill: var(--c-neg); fill-opacity: 0.75; }
  .gs-anat .zero { stroke: var(--muted-color); stroke-opacity: 0.6; }
  .gs-anat .ghost { fill: none; stroke: var(--text-color); stroke-opacity: 0.5; stroke-dasharray: 2 2; }
  .gs-anat .act.buy { fill: var(--c-charge); }
  .gs-anat .act.sell { fill: var(--c-discharge); }
  .gs-anat .dead { fill: var(--c-bad); fill-opacity: 0.07; }
  .gs-anat .cut { stroke: var(--c-bad); stroke-width: 1.5; }
  .gs-anat .soc { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .gs-anat .soc-opt { fill: none; stroke: var(--text-color); stroke-opacity: 0.45; stroke-width: 1.5; stroke-dasharray: 3 3; }
  .gs-anat .endmin { stroke: var(--c-bad); stroke-opacity: 0.6; stroke-dasharray: 4 3; }
  .gs-anat .seen { fill: none; stroke: var(--text-color); stroke-opacity: 0.55; stroke-width: 1.4; stroke-dasharray: 4 3; }
  .gs-anat .fc { fill: none; stroke-width: 1.8; stroke-dasharray: 1.5 2.5; stroke-linecap: round; }
  .gs-anat .hov { fill: var(--text-color); fill-opacity: 0.06; }
  .gs-anat .ptitle { fill: var(--text-color); font-size: 11.5px; font-weight: 600; }
  @media (max-width: 760px) { .gs-anat .body { grid-template-columns: minmax(0, 1fr); } }
  [data-theme="dark"] .gs-anat .pbar:not(.neg) { fill-opacity: 0.5; }
</style>
<script>
  (() => {
    const K = window.GridsimKit;
    const root = K.mount("gs-anat");
    if (!root) return;
    const COLOR = { base: "var(--c-base)", "qwen-sft": "var(--c-qwen)", qwen: "var(--c-qwen)", luna: "var(--c-luna)", beam: "var(--c-beam)", sol: "var(--c-sol)", rule: "var(--c-rule)" };
    const SHAPE = { luna: "dia", sol: "dia", rule: "bar" };
    const POINT = { HB_WEST: "West hub", LZ_WEST: "West load zone", HB_NORTH: "North hub", HB_HOUSTON: "Houston hub", LZ_HOUSTON: "Houston load zone" };
    const f = K.fmt;
    K.whenD3(() => K.data("anatomy.json").then((A) => {
      const d3 = window.d3;
      const cfg = K.config(root);
      let di = Math.min(A.days.length - 1, cfg.day || 0), mk = null;
      root.innerHTML = `<div class="gs-chips days"><span class="gs-lab">Day</span></div><div class="gs-chips models"><span class="gs-lab">Schedule</span></div>
        <div class="story"></div><div class="body"><div class="plot"></div><div class="read"></div></div>
        <div class="gs-legend"></div>`;
      const daysEl = root.querySelector(".days"), modelsEl = root.querySelector(".models"), storyEl = root.querySelector(".story");
      const plotEl = root.querySelector(".plot"), readEl = root.querySelector(".read"), legEl = root.querySelector(".gs-legend");
      const tip = K.tip(root);
      const svg = d3.select(plotEl).append("svg").attr("class", "gs-svg");
      const dateLabel = (d) => d3.timeFormat("%-d %b %Y")(new Date(d.date + "T12:00:00"));

      A.days.forEach((d, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "gs-chip";
        const tier = document.createElement("span"); tier.textContent = d.tier === "blind" ? "blind" : "foresight";
        tier.style.cssText = "font-size:10.5px;padding:0 5px;border-radius:4px;border:1px solid var(--border-color)";
        const lab = document.createElement("b"); lab.textContent = dateLabel(d);
        b.append(lab, document.createTextNode(` ${d.point.replace("_", " ")} `), tier);
        b.addEventListener("click", () => { di = i; mk = null; update(); });
        daysEl.appendChild(b);
      });

      function modelChips(d) {
        modelsEl.querySelectorAll("button").forEach((b) => b.remove());
        d.models.forEach((m) => {
          const b = document.createElement("button");
          b.type = "button"; b.className = "gs-chip"; b.dataset.key = m.key;
          const k = document.createElement("i"); k.className = "k" + (SHAPE[m.color] === "dia" ? " dia" : "");
          k.style.background = COLOR[m.color]; if (m.color === "qwen-sft") k.style.opacity = "0.55";
          const sc = document.createElement("b"); sc.textContent = m.valid ? f.n(m.score, 2) : "none";
          b.append(k, document.createTextNode(m.label + " "), sc);
          b.addEventListener("click", () => { mk = m.key; update(); });
          modelsEl.appendChild(b);
        });
      }

      function update() {
        const d = A.days[di];
        if (!mk || !d.models.find((m) => m.key === mk)) mk = (d.models.find((m) => m.key === "final") || d.models[0]).key;
        daysEl.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === di)));
        modelChips(d);
        modelsEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.key === mk)));
        storyEl.textContent = d.story;
        render();
      }

      function render() {
        const d = A.days[di], m = d.models.find((x) => x.key === mk), b = d.battery, u = b.unit_mwh;
        const W = plotEl.clientWidth || 600;
        const ml = 46, mr = 8, top = 18, h1 = 116, h2 = 92, h3 = 70, gap = 30;
        const H = top + h1 + gap + h2 + gap + h3 + 26;
        svg.selectAll("*").remove();
        svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
        const x = d3.scaleBand().domain(d3.range(24)).range([ml, W - mr]).paddingInner(0.18);
        const bw = Math.min(22, x.bandwidth());
        const xc = (h) => x(h) + x.bandwidth() / 2;
        const seen = d.tier === "blind" ? d.prev_day : null;
        const fc = m && m.forecast ? m.forecast : null;
        const allP = d.prices.concat(seen || [], fc || []);
        const p0 = Math.min(0, d3.min(allP)), p1 = d3.max(allP);
        const y1 = d3.scaleLinear().domain([p0, p1]).nice(4).range([top + h1, top]);
        const g1 = svg.append("g");
        const nar = W < 520;
        g1.append("text").attr("class", "ptitle").attr("x", ml).attr("y", top - 6).text(nar ? "The day's prices, $/MWh" : d.tier === "blind" ? "The day's prices, $/MWh (the agent saw only the days before)" : "The day's prices, $/MWh (the agent sees them all)");
        y1.ticks(4).forEach((v) => {
          g1.append("line").attr("class", v === 0 ? "zero" : "").style("stroke", v === 0 ? null : "var(--grid-color)").attr("x1", ml).attr("x2", W - mr).attr("y1", y1(v)).attr("y2", y1(v));
          g1.append("text").attr("class", "ax").attr("x", ml - 6).attr("y", y1(v) + 3.5).attr("text-anchor", "end").style("fill", "var(--muted-color)").style("font-size", "11px").text(`${v < 0 ? "−" : ""}$${Math.abs(v)}`);
        });
        d.prices.forEach((p, h) => g1.append("rect").attr("class", "pbar" + (p < 0 ? " neg" : "")).attr("x", xc(h) - bw / 2).attr("width", bw)
          .attr("y", Math.min(y1(p), y1(0))).attr("height", Math.max(1, Math.abs(y1(p) - y1(0)))).attr("rx", 2));
        const ln = d3.line().x((v, h) => xc(h)).y((v) => y1(v)).curve(d3.curveMonotoneX);
        if (seen) g1.append("path").attr("class", "seen").attr("d", ln(seen));
        if (fc) g1.append("path").attr("class", "fc").style("stroke", COLOR[m.color]).attr("d", ln(fc));
        // panel 2: the schedule, MW
        const t2 = top + h1 + gap;
        const amax = Math.max(b.k_dis, b.k_ch) * u;
        const y2 = d3.scaleLinear().domain([-amax, amax]).range([t2 + h2, t2]);
        const g2 = svg.append("g");
        g2.append("text").attr("class", "ptitle").attr("x", ml).attr("y", t2 - 6).text(nar ? "The schedule, MW" : "The schedule, MW: sell above the line, buy below");
        [-amax, 0, amax].forEach((v) => {
          g2.append("line").attr("class", v === 0 ? "zero" : "").style("stroke", v === 0 ? null : "var(--grid-color)").attr("x1", ml).attr("x2", W - mr).attr("y1", y2(v)).attr("y2", y2(v));
          g2.append("text").attr("x", ml - 6).attr("y", y2(v) + 3.5).attr("text-anchor", "end").style("fill", "var(--muted-color)").style("font-size", "11px").text(v > 0 ? `+${v}` : v < 0 ? `−${-v}` : "0");
        });
        const cut = m && m.truncated_at != null ? m.truncated_at : null;
        if (cut != null) {
          g2.append("rect").attr("class", "dead").attr("x", x(cut) - 2).attr("width", W - mr - x(cut) + 2).attr("y", t2 - 2).attr("height", h2 + 4);
          g2.append("line").attr("class", "cut").attr("x1", x(cut) - 2).attr("x2", x(cut) - 2).attr("y1", t2 - 4).attr("y2", t2 + h2 + 4);
          g2.append("text").attr("x", Math.min(W - mr - 4, x(cut) + 2)).attr("y", t2 + 10).attr("text-anchor", x(cut) > W * 0.7 ? "end" : "start").style("fill", "var(--c-bad)").style("font-size", "11px").style("font-weight", "600")
            .text(nar ? `${m.kind}, ${f.he(cut)}` : `${m.kind} at ${f.he(cut)}: the rest of the day idles`);
        }
        d.opt.actions.forEach((a, h) => { if (a) g2.append("rect").attr("class", "ghost").attr("x", xc(h) - bw / 2 - 1).attr("width", bw + 2).attr("y", Math.min(y2(a * u), y2(0))).attr("height", Math.abs(y2(a * u) - y2(0))).attr("rx", 2); });
        if (m && m.valid) m.actions.forEach((a, h) => {
          if (!a) return;
          const dead = cut != null && h > cut;
          g2.append("rect").attr("class", "act " + (a > 0 ? "sell" : "buy")).attr("x", xc(h) - bw / 2 + 2).attr("width", bw - 4)
            .attr("y", Math.min(y2(a * u), y2(0))).attr("height", Math.abs(y2(a * u) - y2(0))).attr("rx", 2).style("opacity", dead ? 0.3 : 1);
        });
        // panel 3: state of charge, MWh
        const t3 = t2 + h2 + gap;
        const y3 = d3.scaleLinear().domain([0, b.soc_levels * u]).range([t3 + h3, t3]);
        const g3 = svg.append("g");
        g3.append("text").attr("class", "ptitle").attr("x", ml).attr("y", t3 - 6).text(`State of charge, MWh (of ${b.energy_mwh})`);
        [0, b.soc_levels * u].forEach((v) => {
          g3.append("line").style("stroke", "var(--grid-color)").attr("x1", ml).attr("x2", W - mr).attr("y1", y3(v)).attr("y2", y3(v));
          g3.append("text").attr("x", ml - 6).attr("y", y3(v) + 3.5).attr("text-anchor", "end").style("fill", "var(--muted-color)").style("font-size", "11px").text(v);
        });
        if (b.s_end_min > 0) g3.append("line").attr("class", "endmin").attr("x1", x(20)).attr("x2", W - mr).attr("y1", y3(b.s_end_min * u)).attr("y2", y3(b.s_end_min * u));
        const step = (soc) => { const pts = []; soc.forEach((s, i) => { const xx = i === 0 ? ml : i === 24 ? W - mr : x(i) - x.step() * x.paddingInner() / 2; if (i > 0) pts.push([xx, y3(soc[i - 1] * u)]); pts.push([xx, y3(s * u)]); }); return d3.line()(pts); };
        g3.append("path").attr("class", "soc-opt").attr("d", step(d.opt.soc));
        if (m && m.valid) g3.append("path").attr("class", "soc").style("stroke", COLOR[m.color]).attr("d", step(m.soc));
        // hour axis
        [0, 6, 12, 18, 23].forEach((hh) => svg.append("text").attr("x", xc(hh)).attr("y", H - 6).attr("text-anchor", "middle").style("fill", "var(--muted-color)").style("font-size", "11px").text(f.he(hh)));
        // hover columns
        const hov = svg.append("rect").attr("class", "hov").attr("y", top - 2).attr("height", t3 + h3 - top + 4).attr("width", x.step()).style("display", "none");
        d3.range(24).forEach((hh) => svg.append("rect").attr("x", x(hh) - (x.step() - x.bandwidth()) / 2).attr("width", x.step()).attr("y", top - 2).attr("height", H - top).style("fill", "transparent")
          .on("pointerenter pointermove", (ev) => {
            hov.style("display", null).attr("x", x(hh) - (x.step() - x.bandwidth()) / 2);
            tip.show((el) => {
              K.t.title(el, `${f.he(hh)}, ${f.hour(hh)}–${f.hour(hh + 1)}`);
              K.t.row(el, "price", `${f.usd(d.prices[hh], 2)}/MWh`);
              if (seen) K.t.row(el, "a day earlier", `${f.usd(seen[hh], 2)}/MWh`);
              if (fc) K.t.row(el, "its written forecast", `${f.usd(fc[hh], 0)}/MWh`);
              const ac = (a) => (a > 0 ? `sell ${a * u} MW` : a < 0 ? `buy ${-a * u} MW` : "idle");
              if (m && m.valid) K.t.row(el, m.label, (cut != null && hh > cut ? "idle (truncated)" : ac(m.actions[hh])));
              K.t.row(el, "the optimum", ac(d.opt.actions[hh]));
              if (m && m.valid) K.t.row(el, "charge after the hour", `${m.soc[hh + 1] * u} MWh`);
            }, ev);
          })
          .on("pointerleave", () => { hov.style("display", "none"); tip.hide(); }));
        // legend
        legEl.replaceChildren();
        const item = (cls, style, text) => { const s = document.createElement("span"); const i = document.createElement("i"); i.className = cls; Object.assign(i.style, style); s.append(i, document.createTextNode(text)); legEl.appendChild(s); };
        item("bar", { background: "var(--c-discharge)" }, "sell");
        item("bar", { background: "var(--c-charge)" }, "buy");
        item("bar", { background: "transparent", border: "1px dashed var(--text-color)" }, "the DP optimum");
        item("line", { background: m ? COLOR[m.color] : "var(--text-color)" }, `${m ? m.label : ""}'s charge`);
        item("dash", { borderColor: "var(--text-color)", opacity: 0.6 }, "the optimum's charge");
        if (seen) item("dash", { borderColor: "var(--text-color)", opacity: 0.7 }, "the day before's prices");
        if (fc) item("dash", { borderColor: COLOR[m.color], borderTopStyle: "dotted" }, "the 4B's written forecast");
        if (b.s_end_min > 0) item("dash", { borderColor: "var(--c-bad)" }, "end-of-day obligation");
        readout(d, m);
      }

      function readout(d, m) {
        readEl.replaceChildren();
        const b = d.battery;
        const head = document.createElement("div"); head.className = "head";
        const k = document.createElement("i"); k.style.background = COLOR[m.color]; if (m.color === "qwen-sft") k.style.opacity = "0.55";
        head.append(k, document.createTextNode(m.label));
        const sc = document.createElement("div"); sc.className = "score";
        sc.textContent = m.valid ? f.n(m.score, 3) : "0";
        const scl = document.createElement("div");
        scl.textContent = d.tier === "blind" ? "hindsight capture r_opt (idle 0.2, the optimum 1)" : "reward R (idle 0.2, the optimum 1)";
        const kind = document.createElement("span"); kind.className = "kind" + (m.kind === "ok" ? "" : " bad");
        kind.textContent = m.kind === "ok" ? "every rule kept" : m.kind;
        const kv = document.createElement("div"); kv.className = "kv";
        const add = (a, v) => { const s1 = document.createElement("span"); s1.textContent = a; const s2 = document.createElement("span"); s2.textContent = v; kv.append(s1, s2); };
        add("profit", m.valid ? f.usd(m.profit, 0) : "no valid schedule");
        add("the optimum", f.usd(d.p_opt, 0));
        add("doing nothing", f.usd(d.p_idle, 0));
        if (d.tier === "blind") add("persistence-DP", f.usd(d.models.find((x) => x.key === "persistence-dp").profit, 0));
        add("battery", `${b.p_dis_mw} MW / ${b.energy_mwh} MWh`);
        add("starts at", `${b.s0 * b.unit_mwh} MWh${b.s_end_min ? `, ends ≥ ${b.s_end_min * b.unit_mwh}` : ""}`);
        add("efficiency, wear", `${Math.round(b.eta * 100)}%, $${b.c_deg}/MWh`);
        readEl.append(head, sc, scl, kind, kv);
        if (m.text) {
          const q = document.createElement("div"); q.className = "q"; q.textContent = "What it wrote before its call:";
          const pre = document.createElement("pre"); pre.textContent = m.text;
          readEl.append(q, pre);
        }
      }

      update();
      K.watch(root, render);
    }).catch((e) => { root.textContent = e.message; }));
  })();
</script>
