<div class="gs-board"></div>
<style>
  .gs-board { font-size: 12.5px; }
  .gs-board svg { display: block; width: 100%; overflow: visible; }
  .gs-board .rl { fill: var(--text-color); font-size: 12.5px; }
  .gs-board .rl.me { font-weight: 650; }
  .gs-board .re { fill: var(--muted-color); font-size: 11.5px; }
  .gs-board .rv { fill: var(--text-color); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .gs-board .rc { fill: var(--muted-color); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .gs-board .ci { stroke: var(--text-color); stroke-opacity: 0.55; stroke-width: 1.2; }
  .gs-board .ref { stroke-width: 1.2; stroke-dasharray: 3 3; }
  .gs-board .ref-t { font-size: 11px; fill: var(--muted-color); }
  .gs-board .band { fill: var(--band); }
  .gs-board .hdr { fill: var(--muted-color); font-size: 11px; }
  .gs-board .summary { font-size: 13px; line-height: 1.5; color: var(--text-color); margin: 0 0 10px; }
</style>
<script>
  (() => {
    const K = window.GridsimKit;
    const root = K.mount("gs-board");
    if (!root) return;
    const f = K.fmt;
    const KIND = { ok: "every rule kept", all_idle: "all idle", overfill: "overfill", sell_before_charge: "sell before charge", end_short: "end short", cycle_cap: "cycle cap", rate: "rate", malformed: "no parseable call", truncated: "cut off while thinking", error: "infra error" };
    K.whenD3(() => K.data("results.json").then((R) => {
      const d3 = window.d3;
      const cfg = K.config(root);
      const ORDER = ["blind-fresh", "blind-eval2025", "foresight-eval2025", "foresight-fresh"];
      const packs = ORDER.map((k) => R.leaderboard.packs.find((p) => p.key === k)).filter(Boolean);
      let pi = Math.max(0, packs.findIndex((p) => p.key === (cfg.pack || "blind-fresh")));
      root.innerHTML = '<div class="gs-chips"><span class="gs-lab">Days</span></div><p class="summary"></p><div class="plot"></div><div class="gs-legend"></div><div class="gs-note"></div>';
      const chips = root.querySelector(".gs-chips"), plot = root.querySelector(".plot"), sum = root.querySelector(".summary");
      const leg = root.querySelector(".gs-legend"), note = root.querySelector(".gs-note");
      const tip = K.tip(root);
      const svg = d3.select(plot).append("svg").attr("class", "gs-svg");
      packs.forEach((p, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "gs-chip";
        const strong = document.createElement("b"); strong.textContent = p.label;
        b.append(strong, document.createTextNode(` ${p.n_tasks}`));
        b.addEventListener("click", () => { pi = i; render(); });
        chips.appendChild(b);
      });
      const refColor = { "persistence-dp": "var(--c-rule)", "teacher-dp": "var(--text-color)", greedy: "var(--c-rule)", threshold: "var(--c-ref)" };
      function render() {
        chips.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === pi)));
        const P = packs[pi];
        const rows = P.rows.slice().sort((a, b) => b.mean - a.mean);
        const refs = P.baselines.filter((b) => (P.tier === "blind" ? ["persistence-dp", "teacher-dp"] : ["greedy", "threshold"]).includes(b.key));
        const fin = rows.find((r) => r.key === "final"), sol = rows.find((r) => r.key === "sol");
        const metric = P.tier === "blind" ? "hindsight capture" : "reward R";
        sum.textContent = `${P.label}, ${P.when}: ${P.n_tasks} battery-days on ${P.n_days} days. ${metric.charAt(0).toUpperCase() + metric.slice(1)}, idle 0.2, the optimum 1.` +
          (fin && sol ? ` The trained 4B scores ${f.n(fin.mean)}; GPT-6.1 Sol ${f.n(sol.mean)}.` : "");
        const W = plot.clientWidth || 640;
        const narrow = W < 560;
        const lw = narrow ? 0 : 196, cw = narrow ? 0 : 74, rh = narrow ? 44 : 30, top = 46;
        const x0 = lw + 10, x1 = W - cw - (narrow ? 10 : 46);
        const x = d3.scaleLinear().domain([0, 1]).range([x0, x1]);
        const H = top + rows.length * rh + 26;
        svg.selectAll("*").remove();
        svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
        [0, 0.2, 0.4, 0.6, 0.8, 1].forEach((v) => {
          svg.append("line").attr("x1", x(v)).attr("x2", x(v)).attr("y1", top - 6).attr("y2", H - 22).style("stroke", "var(--grid-color)");
          svg.append("text").attr("x", x(v)).attr("y", H - 6).attr("text-anchor", "middle").style("fill", "var(--muted-color)").style("font-size", "11px").text(v === 0.2 ? "0.2 idle" : v);
        });
        if (!narrow) svg.append("text").attr("class", "hdr").attr("x", W).attr("y", top - 6).attr("text-anchor", "end").text("$ / battery-day");
        refs.forEach((b, i) => {
          const xx = x(b.mean);
          svg.append("line").attr("class", "ref").attr("x1", xx).attr("x2", xx).attr("y1", top - 30 + i * 14).attr("y2", H - 22).style("stroke", refColor[b.key]);
          svg.append("text").attr("class", "ref-t halo").attr("x", xx - 4).attr("y", top - 32 + i * 14 + 9).attr("text-anchor", "end")
            .text(`${b.key === "teacher-dp" ? "forecaster + DP" : b.key === "persistence-dp" ? "persistence-DP" : `${b.key} rule`} ${f.n(b.mean)}`);
        });
        rows.forEach((r, i) => {
          const y = top + i * rh + (narrow ? 16 : 0);
          const me = r.key === "final";
          const color = K.colorOf(r), shape = K.shapeOf(r);
          if (me) svg.append("rect").attr("class", "band").attr("x", 0).attr("y", y - (narrow ? 18 : 4)).attr("width", W).attr("height", narrow ? rh : rh - 2).attr("rx", 4);
          const lx = narrow ? x0 : lw;
          const lab = svg.append("text").attr("class", "rl" + (me ? " me" : "")).attr("x", lx).attr("y", y + (narrow ? -5 : 13)).attr("text-anchor", narrow ? "start" : "end").text(r.label);
          if (r.effort) lab.append("tspan").attr("class", "re").text(`  ${r.effort}`);
          svg.append("rect").attr("x", x(0)).attr("y", y + 3).attr("width", Math.max(2, x(r.mean) - x(0))).attr("height", 12).attr("rx", 3).style("fill", color).style("fill-opacity", r.key === "base" ? 0.6 : 0.85);
          svg.append("line").attr("class", "ci").attr("x1", x(r.ci[0])).attr("x2", x(r.ci[1])).attr("y1", y + 9).attr("y2", y + 9);
          [r.ci[0], r.ci[1]].forEach((v) => svg.append("line").attr("class", "ci").attr("x1", x(v)).attr("x2", x(v)).attr("y1", y + 5).attr("y2", y + 13));
          K.symbol(svg, shape === "bar" ? "dot" : shape, x(r.mean), y + 9, 4.2, color).style("stroke", "var(--page-bg)").style("stroke-width", 1.5);
          svg.append("text").attr("class", "rv").attr("x", Math.max(x(r.ci[1]), x(r.mean)) + 8).attr("y", y + 13).text(f.n(r.mean));
          if (!narrow) svg.append("text").attr("class", "rc").attr("x", W).attr("y", y + 13).attr("text-anchor", "end").text(r.usd == null ? "–" : f.usd(r.usd));
          svg.append("rect").attr("x", 0).attr("y", y - (narrow ? 18 : 4)).attr("width", W).attr("height", rh).style("fill", "transparent")
            .on("pointerenter pointermove", (ev) => tip.show((el) => {
              K.t.title(el, K.labelOf(r), color);
              K.t.row(el, metric, `${f.n(r.mean)} ${f.ci(r.ci)}`);
              if (r.usd != null) K.t.row(el, "cost per battery-day", f.usd(r.usd));
              if (r.tokens != null) K.t.row(el, "output tokens", f.int(r.tokens));
              K.t.row(el, "valid schedules", f.pct(r.valid, 1));
              K.t.row(el, "break no rule", f.pct(r.feasible, 1));
              const bad = Object.entries(r.kinds).filter(([k]) => k !== "ok").sort((a, b) => b[1] - a[1]).slice(0, 3);
              if (bad.length) K.t.note(el, "Most common failures: " + bad.map(([k, n]) => `${KIND[k] || k} ${n}`).join(", "));
            }, ev)).on("pointerleave", () => tip.hide());
        });
        leg.replaceChildren();
        const item = (cls, style, text) => { const s = document.createElement("span"); const i = document.createElement("i"); i.className = cls; Object.assign(i.style, style); s.append(i, document.createTextNode(text)); leg.appendChild(s); };
        item("", { background: "var(--c-qwen)" }, "Qwen3-4B, trained");
        item("", { background: "var(--c-base)" }, "Qwen3-4B, untrained");
        item("dia", { background: "var(--c-sol)" }, "GPT-6.1 Sol");
        item("dia", { background: "var(--c-luna)" }, "GPT-6 Luna");
        if (rows.some((r) => r.family === "beam")) item("", { background: "var(--c-beam)" }, "Beam-1.0");
        item("dash", { borderColor: "var(--c-rule)" }, "a rule with no LLM");
        note.textContent = "Dots: open weights; diamonds: API models. Whiskers: 95% day-block bootstrap intervals. Cost: API models at list price; the 4Bs at their batched generation time on one GPU.";
      }
      render();
      K.watch(root, render);
    }).catch((e) => { root.textContent = e.message; }));
  })();
</script>
