<div class="gs-tools"></div>
<style>
  .gs-tools { font-size: 12.5px; }
  .gs-tools .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px 18px; }
  .gs-tools .sys { border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px 8px; background: var(--surface-bg); }
  .gs-tools .sys h4 { margin: 0 0 2px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-color); }
  .gs-tools .tool { padding: 7px 0 6px; border-top: 1px solid var(--border-color); }
  .gs-tools .sys h4 + .tool { border-top: 0; }
  .gs-tools code { font-size: 12px; font-weight: 600; color: var(--text-color); background: none; padding: 0; }
  .gs-tools .what { color: var(--muted-color); font-size: 12px; line-height: 1.4; margin: 1px 0 5px; }
  .gs-tools .bars { display: grid; grid-template-columns: 74px 1fr 34px; gap: 2px 8px; align-items: center; }
  .gs-tools .bars span { font-size: 11px; color: var(--muted-color); white-space: nowrap; }
  .gs-tools .bars span.v { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-color); }
  .gs-tools .bar { height: 7px; border-radius: 3px; min-width: 1px; }
  .gs-tools .track { background: var(--grid-color); border-radius: 3px; }
</style>
<script>
  (() => {
    const K = window.GridsimKit;
    const root = K.mount("gs-tools");
    if (!root) return;
    const SYSTEMS = [
      ["ERCOT's public reports", [
        ["get_prices", "the node's DAM, 15-minute RT and 5-minute SCED prices, and the hub's, as each posted"],
        ["get_forecasts", "ERCOT's load, wind, solar and outage forecasts as issued, NWS alerts, and the desk's price forecast (modelled)"],
        ["get_grid_conditions", "reserves, system lambda, load, wind, solar and ERCOT's notices"]]],
      ["Plant telemetry", [["get_asset_status", "state of charge, limits, recent base points and outages"]]],
      ["The desk's book", [["get_position", "DAM awards, the RT position, the COP and the statement settled so far"]]],
      ["ERCOT's market submission system", [
        ["submit_dam_offers", "the day-ahead energy bid/offer curves, one per hour, before the 10:00 close (from v3, reserve offers too)"],
        ["submit_rt_offers", "real-time curves, from 18:00 the day before"],
        ["update_cop", "the Current Operating Plan"],
        ["check_submission", "a dry run that returns ERCOT-style validation codes"]]],
      ["The desk's analytics", [
        ["optimize", "a co-optimiser on the agent's own price view that proposes curves and a COP and never submits"],
        ["set_reminder", "wake me at this minute, with a note"]]],
    ];
    const COL = { sol: "var(--c-sol)", luna: "var(--c-luna)", qwen: "var(--c-qwen)" };
    K.whenD3(() => K.data("desk.json").then((D) => {
      const d3 = window.d3;
      let vi = D.versions.length - 1;
      root.innerHTML = '<div class="gs-chips"><span class="gs-lab">Calls in</span></div><div class="grid"></div><div class="gs-note"></div>';
      const chips = d3.select(root).select(".gs-chips");
      D.versions.forEach((v, i) => {
        const b = chips.append("button").attr("class", "gs-chip").attr("type", "button").attr("aria-pressed", i === vi).html(`<b>${v.version}</b> ${v.name}`);
        b.on("click", () => { vi = i; chips.selectAll(".gs-chip").attr("aria-pressed", function () { return this === b.node(); }); render(); });
      });
      function render() {
        const V = D.versions[vi], unit = V.days_per_task > 1 ? `${V.days_per_task}-day window` : "battery-day";
        const max = d3.max(V.models, (m) => d3.max(Object.values(m.calls_by_tool)));
        const grid = d3.select(root).select(".grid").html("");
        SYSTEMS.forEach(([name, tools]) => {
          const card = grid.append("div").attr("class", "sys");
          card.append("h4").text(name);
          tools.forEach(([tool, what]) => {
            const t = card.append("div").attr("class", "tool");
            t.append("code").text(tool);
            t.append("div").attr("class", "what").text(what);
            const bars = t.append("div").attr("class", "bars");
            V.models.forEach((m) => {
              const n = m.calls_by_tool[tool] || 0;
              bars.append("span").text(m.name.replace(" (untrained)", ""));
              bars.append("div").attr("class", "track").append("div").attr("class", "bar").style("width", `${(100 * n) / max}%`).style("background", COL[m.key] || "var(--c-base)");
              bars.append("span").attr("class", "v").text(K.fmt.n(n, 1));
            });
          });
        });
        d3.select(root).select(".gs-note").text(`Mean calls a ${unit} in ${V.version}, ${V.name}, from each model's runs (${V.models.map((m) => `${m.name} ${K.fmt.n(m.calls, 1)} calls in all`).join("; ")}). The real desk's systems behind each tool: ERCOT's public reports, the plant's telemetry, the desk's book, ERCOT's market submission system and the desk's own analytics.`);
      }
      render();
    }));
  })();
</script>
