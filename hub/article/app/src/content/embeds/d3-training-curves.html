<div class="gs-curves"></div>
<style>
  .gs-curves { font-size: 12px; }
  .gs-curves svg { display: block; width: 100%; overflow: visible; }
  .gs-curves .band3 { fill: var(--c-qwen); fill-opacity: 0.13; }
  .gs-curves .l3 { fill: none; stroke: var(--c-qwen); stroke-width: 2.2; stroke-linejoin: round; }
  .gs-curves .seg { fill: none; stroke-width: 1.8; stroke-dasharray: 5 4; }
  .gs-curves .ref { stroke-width: 1.1; stroke-dasharray: 3 3; }
  .gs-curves .lab { font-size: 11.5px; fill: var(--text-color); }
  .gs-curves .lab.b { font-weight: 650; }
  .gs-curves .sub { font-size: 11px; fill: var(--muted-color); }
  .gs-curves .hov { stroke: var(--text-color); stroke-opacity: 0.35; }
</style>
<script>
  (() => {
    const K = window.GridsimKit;
    const root = K.mount("gs-curves");
    if (!root) return;
    const f = K.fmt;
    K.whenD3(() => K.data("results.json").then((R) => {
      const d3 = window.d3;
      const C = R.training.curve;
      const tip = K.tip(root);
      const svg = d3.select(root).append("svg").attr("class", "gs-svg");
      root.insertAdjacentHTML("beforeend", '<div class="gs-legend"></div>');
      const leg = root.querySelector(".gs-legend");
      function render() {
        svg.selectAll("*").remove();
        const W = root.clientWidth || 680;
        const narrow = W < 560;
        const ml = 40, mr = narrow ? 10 : 132, mt = 14, mb = 36;
        const H = Math.round(Math.min(400, Math.max(300, W * 0.5)));
        svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
        const x = d3.scaleLinear().domain([0, 335]).range([ml, W - mr]);
        const y = d3.scaleLinear().domain([0.62, 1.01]).range([H - mb, mt]);
        [0.7, 0.8, 0.9, 1.0].forEach((v) => {
          svg.append("line").attr("x1", ml).attr("x2", W - mr).attr("y1", y(v)).attr("y2", y(v)).style("stroke", "var(--grid-color)");
          svg.append("text").attr("x", ml - 6).attr("y", y(v) + 3.5).attr("text-anchor", "end").style("fill", "var(--muted-color)").style("font-size", "11px").text(v.toFixed(1));
        });
        [0, 100, 200, 300].forEach((v) => svg.append("text").attr("x", x(v)).attr("y", H - mb + 15).attr("text-anchor", "middle").style("fill", "var(--muted-color)").style("font-size", "11px").text(v));
        svg.append("text").attr("x", (ml + W - mr) / 2).attr("y", H - 4).attr("text-anchor", "middle").style("fill", "var(--muted-color)").style("font-size", "11px").text("training step");
        const refs = [["sol", "GPT-6.1 Sol", "var(--c-sol)"], ["luna_high", "GPT-6 Luna, high", "var(--c-luna)"], ["greedy_rule", "greedy rule", "var(--c-rule)"]];
        refs.forEach(([k, l, c]) => {
          const v = Math.min(1, C[k].mean);
          svg.append("line").attr("class", "ref").attr("x1", ml).attr("x2", W - mr).attr("y1", y(v)).attr("y2", y(v)).style("stroke", c);
          svg.append("text").attr("class", "sub halo").attr("x", narrow ? W - mr - 2 : W - mr + 6).attr("y", y(v) + (narrow ? -4 : 3.5)).attr("text-anchor", narrow ? "end" : "start").text(`${l} ${f.n(C[k].mean)}`);
        });
        // runs 1 and 2: start and end on all 200 days
        [["run1", "var(--c-rule)", "run 1, GRPO"], ["run2", "var(--c-base)", "run 2, GRPO"]].forEach(([k, c, l]) => {
          const r = C[k];
          const p0 = [x(0), y(r.start.mean)], p1 = [x(r.end.step), y(r.end.mean)];
          svg.append("path").attr("class", "seg").style("stroke", c).attr("d", d3.line()([p0, p1]));
          [[0, r.start], [r.end.step, r.end]].forEach(([s, v]) => {
            svg.append("line").attr("x1", x(s)).attr("x2", x(s)).attr("y1", y(v.ci[0])).attr("y2", y(v.ci[1])).style("stroke", c).style("stroke-width", 1.4);
            svg.append("circle").attr("cx", x(s)).attr("cy", y(v.mean)).attr("r", 3.6).style("fill", c).style("stroke", "var(--page-bg)").style("stroke-width", 1.5);
          });
          svg.append("text").attr("class", "lab halo").attr("x", x(r.end.step) + (narrow ? -6 : 8)).attr("y", y(r.end.mean) + (k === "run1" ? 12 : 4)).attr("text-anchor", narrow ? "end" : "start")
            .text(`${l} ${f.n(r.start.mean)} → ${f.n(r.end.mean)}`);
        });
        // run 3: every checkpoint, sampled, with its interval
        const c3 = C.run3;
        svg.append("path").attr("class", "band3").attr("d", d3.area().x((p) => x(p.step)).y0((p) => y(p.sampled.ci[0])).y1((p) => y(p.sampled.ci[1])).curve(d3.curveMonotoneX)(c3));
        svg.append("path").attr("class", "l3").attr("d", d3.line().x((p) => x(p.step)).y((p) => y(p.sampled.mean)).curve(d3.curveMonotoneX)(c3));
        c3.forEach((p) => svg.append("circle").attr("cx", x(p.step)).attr("cy", y(p.sampled.mean)).attr("r", 3.2).style("fill", "var(--c-qwen)").style("stroke", "var(--page-bg)").style("stroke-width", 1.5));
        const last = c3[c3.length - 1];
        svg.append("text").attr("class", "lab b halo").attr("x", x(last.step) + (narrow ? -6 : 8)).attr("y", y(last.sampled.mean) - (narrow ? 10 : 2)).attr("text-anchor", narrow ? "end" : "start")
          .text(`run 3, exact DP advantages ${f.n(c3[0].sampled.mean)} → ${f.n(last.sampled.mean)}`);
        // hover: nearest run-3 checkpoint
        const hl = svg.append("line").attr("class", "hov").attr("y1", mt).attr("y2", H - mb).style("display", "none");
        svg.append("rect").attr("x", ml).attr("y", mt).attr("width", W - mr - ml).attr("height", H - mb - mt).style("fill", "transparent")
          .on("pointermove", (ev) => {
            const [mx] = d3.pointer(ev);
            const p = c3.reduce((a, b) => (Math.abs(x(b.step) - mx) < Math.abs(x(a.step) - mx) ? b : a));
            hl.style("display", null).attr("x1", x(p.step)).attr("x2", x(p.step));
            tip.show((el) => {
              K.t.title(el, `Run 3, step ${p.step}`, "var(--c-qwen)");
              K.t.row(el, "held-out R, sampled", `${f.n(p.sampled.mean)} ${f.ci(p.sampled.ci)}`);
              K.t.row(el, "greedy decoding", f.n(p.greedy));
              K.t.row(el, "schedules that break no rule", f.pct(p.feasible, 1));
            }, ev);
          })
          .on("pointerleave", () => { hl.style("display", "none"); tip.hide(); });
        leg.replaceChildren();
        const item = (cls, style, text) => { const s = document.createElement("span"); const i = document.createElement("i"); i.className = cls; Object.assign(i.style, style); s.append(i, document.createTextNode(text)); leg.appendChild(s); };
        item("line", { background: "var(--c-qwen)" }, "run 3: exact per-hour DP advantages (PPO-clipped loop, PEFT, vLLM)");
        item("dash", { borderColor: "var(--c-base)" }, "run 2: GRPO in TRL, same warm start");
        item("dash", { borderColor: "var(--c-rule)" }, "run 1: GRPO in TRL, weaker warm start");
      }
      render();
      K.watch(root, render);
    }).catch((e) => { root.textContent = e.message; }));
  })();
</script>
